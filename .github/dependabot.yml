version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tensorflow:
        patterns: ['@tensorflow/*']
      lint:
        patterns: ['eslint*', '@typescript-eslint/*', '@html-eslint/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
