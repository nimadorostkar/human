server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm;

  # nginx default mime.types (loaded in the http block) already maps .wasm to application/wasm and .bin to application/octet-stream

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # model weights and library bundles only change between releases
  location ~* ^/(models|dist|assets)/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
}
